			(function() {
				// 1. 禁止滑鼠右鍵選單 (但在表單 input / textarea 保留右鍵貼上/複製，確保訪客能正常打字)
				document.addEventListener('contextmenu', function(e) {
					var tag = e.target && e.target.tagName;
					if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) {
						return;
					}
					e.preventDefault();
				}, false);

				// 2. 禁止圖片、畫布拖曳下載
				document.addEventListener('dragstart', function(e) {
					var tag = e.target && e.target.tagName;
					if (tag === 'IMG' || tag === 'CANVAS' || tag === 'A') {
						e.preventDefault();
					}
				}, false);

				// 3. 正式發布環境防護：阻擋 F12、Ctrl+Shift+I/J/C、Ctrl+U 查看原始碼、Ctrl+S 另存網頁
				// (💡 在本機 localhost / 127.0.0.1 開發環境下自動放行，以便本機開發除錯)
				var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
				if (!isLocal) {
					document.addEventListener('keydown', function(e) {
						// F12
						if (e.key === 'F12' || e.keyCode === 123) {
							e.preventDefault();
							e.stopPropagation();
							return false;
						}

						// Ctrl + Shift + I (DevTools) / Cmd + Option + I
						// Ctrl + Shift + J (Console)  / Cmd + Option + J
						// Ctrl + Shift + C (Inspect)  / Cmd + Option + C
						if ((e.ctrlKey || e.metaKey) && e.shiftKey && (
							e.key === 'I' || e.key === 'i' ||
							e.key === 'J' || e.key === 'j' ||
							e.key === 'C' || e.key === 'c' ||
							e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67
						)) {
							e.preventDefault();
							e.stopPropagation();
							return false;
						}

						// Ctrl + U (檢視原始碼) / Cmd + Option + U
						if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
							e.preventDefault();
							e.stopPropagation();
							return false;
						}

						// Ctrl + S (另存網頁) / Cmd + S
						if ((e.ctrlKey || e.metaKey) && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) {
							e.preventDefault();
							e.stopPropagation();
							return false;
						}
					}, false);

					// 4. 若有人打開 Console，顯示警示訊息
					try {
						console.log(
							'%c3d砌作 %c- 本站所有模型、作品照片與前端程式碼均受著作權法保護，禁止未經授權之抓取與散布。',
							'font-size:16px;color:#34d399;font-weight:bold;',
							'font-size:12px;color:#94a3b8;'
						);
					} catch(err) {}
				}
			})();
		</script></body></html>
